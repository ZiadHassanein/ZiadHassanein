<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Ziad Hassanein — Full-stack .NET Developer</title>
<desc id="desc">A textured graphite banner with editorial typography and a dimensional, gently floating C# editor. C#, ASP.NET Core, Angular, and React. Motion pauses when reduced motion is preferred.</desc>
<defs>
  <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1C2228"/><stop offset=".48" stop-color="#10161B"/><stop offset="1" stop-color="#151C20"/></linearGradient>
  <radialGradient id="light"><stop stop-color="#668178" stop-opacity=".26"/><stop offset="1" stop-color="#668178" stop-opacity="0"/></radialGradient>
  <linearGradient id="metal" x1="0" y1="0" x2=".5" y2="1"><stop stop-color="#74818A"/><stop offset=".08" stop-color="#414D57"/><stop offset=".85" stop-color="#222E36"/><stop offset="1" stop-color="#52646B"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#27333A"/><stop offset=".45" stop-color="#1A242B"/><stop offset="1" stop-color="#151D24"/></linearGradient>
  <linearGradient id="rim"><stop stop-color="#A2B7B4" stop-opacity=".8"/><stop offset=".55" stop-color="#6C8F8B" stop-opacity=".12"/><stop offset="1" stop-color="#DEA06A" stop-opacity=".6"/></linearGradient>
  <linearGradient id="warm"><stop stop-color="#D39F72" stop-opacity="0"/><stop offset=".7" stop-color="#D39F72" stop-opacity=".28"/><stop offset="1" stop-color="#D39F72" stop-opacity="0"/></linearGradient>
  <filter id="shadow" x="-35%" y="-35%" width="180%" height="200%"><feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000" flood-opacity=".52"/><feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000" flood-opacity=".45"/></filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".78" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".065"/></feComponentTransfer><feBlend in="SourceGraphic" mode="soft-light"/></filter>
</defs><style>
  .lift{transform:translateY(0)}
  .trace{stroke-dasharray:54 546;stroke-dashoffset:165}
  .caret{opacity:.7}
  @keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes travel{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}
  @keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
  @media (prefers-reduced-motion:no-preference){.lift{animation:drift 8s ease-in-out infinite}.trace{animation:travel 7s linear infinite}.caret{animation:breathe 2.8s ease-in-out infinite}}
</style>
<rect x=".5" y=".5" width="1199" height="439" rx="18" fill="url(#ground)" stroke="#3F4A50"/>
<rect x="1" y="1" width="1198" height="438" rx="18" opacity=".7" filter="url(#grain)"/>
<ellipse cx="947" cy="206" rx="330" ry="260" fill="url(#light)"/>
<path d="M22 1H1178" stroke="url(#rim)" stroke-opacity=".55"/>
<path d="M48 88H100" stroke="#C39773" stroke-width="2"/>
<g font-family="Consolas, 'Liberation Mono', monospace">
  <text x="48" y="59" fill="#ABB9BE" font-size="13" letter-spacing="2.3">SOFTWARE DEVELOPER / EGYPT</text>
  <text x="49" y="353" fill="#BECDD0" font-size="16">C#<tspan fill="#6C827F"> / </tspan>ASP.NET Core<tspan fill="#6C827F"> / </tspan>Angular<tspan fill="#6C827F"> / </tspan>React</text>
</g>
<text x="45" y="182" fill="#F3EEE5" font-family="Georgia, 'Times New Roman', serif" font-size="76" letter-spacing="-2.8">Ziad <tspan font-style="italic">Hassanein</tspan></text>
<text x="49" y="239" fill="#9EE0CA" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="500" letter-spacing=".2">Full-stack .NET Developer</text>
<text x="49" y="285" fill="#B0BDC3" font-family="Segoe UI, Arial, sans-serif" font-size="19">APIs, integrations, and products people use.</text>
<path d="M49 314H649" stroke="#53646C" stroke-opacity=".42"/>
<path d="M49 392H102" stroke="#839C96" stroke-opacity=".6"/>
<text x="116" y="397" fill="#829793" font-family="Consolas, monospace" font-size="11" letter-spacing="2">FROM IDEA TO IMPLEMENTATION</text>
<ellipse cx="938" cy="366" rx="172" ry="21" fill="#05090C" opacity=".42"/>
<path d="M731 335C790 388 1038 409 1147 325" pathLength="600" stroke="#5F8278" stroke-opacity=".28" stroke-width="1.5"/>
<path class="trace" d="M731 335C790 388 1038 409 1147 325" pathLength="600" stroke="#9EE0CA" stroke-width="2.5" stroke-linecap="round"/>
<g transform="translate(758 98)">
 <g class="lift">
  <g transform="rotate(-7 180 116)">
   <rect x="23" y="-11" width="342" height="230" rx="12" fill="#111A20" stroke="#52616A" stroke-opacity=".6" transform="rotate(5 180 110)"/>
   <g filter="url(#shadow)">
    <rect x="0" y="9" width="360" height="226" rx="13" fill="url(#metal)"/>
    <path d="M12 232H348" stroke="#8BA09F" stroke-opacity=".28"/>
    <rect x="0" y="0" width="360" height="224" rx="12" fill="url(#screen)" stroke="url(#rim)" stroke-width="1.2"/>
    <path d="M1 38H359" stroke="#809394" stroke-opacity=".2"/>
    <path d="M12 1H348" stroke="#B5C9C2" stroke-opacity=".4"/>
    <circle cx="18" cy="19" r="3.5" fill="#BF8C66"/><circle cx="31" cy="19" r="3.5" fill="#899792"/><circle cx="44" cy="19" r="3.5" fill="#80BAA4"/>
    <text x="139" y="23" fill="#B0BFC4" font-family="Consolas, monospace" font-size="10.5">Program.cs</text>
    <text x="323" y="23" fill="#90B6AD" font-family="Consolas, monospace" font-size="10">C#</text>
    <g font-family="Consolas, 'Liberation Mono', monospace" font-size="12.5">
     <g fill="#61777F" font-size="10"><text x="19" y="75">1</text><text x="19" y="98">2</text><text x="19" y="121">3</text><text x="19" y="144">4</text><text x="19" y="167">5</text><text x="19" y="190">6</text></g>
     <text x="45" y="75" fill="#C9D4D8">app.<tspan fill="#99CEBA">MapGet</tspan>(<tspan fill="#D9B68A">"/api"</tspan>, () =&gt;</text>
     <text x="45" y="98" fill="#C9D4D8" xml:space="preserve">    Results.<tspan fill="#99CEBA">Ok</tspan>(<tspan fill="#B6A7CB">new</tspan></text>
     <text x="45" y="121" fill="#C9D4D8" xml:space="preserve">    {</text>
     <text x="45" y="144" fill="#C9D4D8" xml:space="preserve">        name = <tspan fill="#D9B68A">"Ziad Hassanein"</tspan>,</text>
     <text x="45" y="167" fill="#C9D4D8" xml:space="preserve">        stack = <tspan fill="#D9B68A">".NET"</tspan></text>
     <text x="45" y="190" fill="#C9D4D8" xml:space="preserve">    }));</text>
    </g>
    <path d="M45 49V207" stroke="#849A9B" stroke-opacity=".08"/>
    <rect class="caret" x="218" y="156" width="2" height="14" fill="#A5ECD0"/>
    <path d="M255 220H344" stroke="url(#warm)" stroke-width="3"/>
   </g>
  </g>
 </g>
</g>
</svg>