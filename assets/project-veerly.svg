<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="520" viewBox="0 0 1160 520" fill="none" role="img" aria-labelledby="title desc"><title id="title">Veerly — backend, Flutter app, and learning media</title><desc id="desc">Veerly — a multilingual driving-theory app. Built the ASP.NET Core backend with JWT authentication, progress tracking, flashcards, and leaderboards. Enhanced the Flutter app and integrated lessons, practice, and progress. Created learning content and illustrations, plus driving-scene videos using Blender. Enhanced Flutter means contributions to an existing app, not sole authorship of the whole app. This is a map of contribution areas, not a system architecture or sequence.</desc><rect x=".5" y=".5" width="1159" height="519" rx="8" fill="#101720" stroke="#273341"/><g font-family="'Segoe UI', Arial, sans-serif"><g font-family="Consolas, 'Liberation Mono', monospace"><text x="38" y="34" font-size="14" fill="#91A3B8" letter-spacing="1.2">02 / SELECTED WORK</text></g><svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" x="38" y="62" width="72" height="72">
