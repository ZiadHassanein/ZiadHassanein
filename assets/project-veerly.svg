<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="520" viewBox="0 0 1160 520" fill="none" role="img" aria-labelledby="title desc"><title id="title">Veerly — backend, Flutter app, and learning media</title><desc id="desc">Veerly — a multilingual driving-theory app. Built the ASP.NET Core backend with JWT authentication, progress tracking, flashcards, and leaderboards. Enhanced the Flutter app and integrated lessons, practice, and progress. Created learning content and illustrations, plus driving-scene videos using Blender. Enhanced Flutter means contributions to an existing app, not sole authorship of the whole app. This is a map of contribution areas, not a system architecture or sequence.</desc><rect x=".5" y=".5" width="1159" height="519" rx="8" fill="#101720" stroke="#273341"/><g font-family="'Segoe UI', Arial, sans-serif"><g font-family="Consolas, 'Liberation Mono', monospace"><text x="38" y="34" font-size="14" fill="#91A3B8" letter-spacing="1.2">02 / SELECTED WORK</text></g><image x="1025" y="65" width="76" height="76" preserveAspectRatio="xMidYMid meet" href="data:image/png;base64,"/><text x="36" y="94" font-size="44" fill="#E9EFF6" font-weight="650" letter-spacing="-1.3">Veerly</text><text x="38" y="132" font-size="24" fill="#91A3B8" >Multilingual driving theory</text><g font-family="Consolas, 'Liberation Mono', monospace"><text x="1100" y="43" font-size="14" fill="#68A9FF" letter-spacing="1.2" text-anchor="end">MY CONTRIBUTIONS</text></g><rect x="38" y="175" width="350" height="310" rx="5" stroke="#273341"/><g transform="translate(213 247) scale(1.5)" fill="none" stroke="#68A9FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-13-16-27 0-13 16M13-16 27 0 13 16M6-23-6 23"/></g><text x="213" y="319" font-size="24" fill="#E9EFF6" font-weight="600" text-anchor="middle">Built backend</text><path d="M103 342H323" stroke="#273341"/><text x="213" y="382" font-size="20" fill="#91A3B8" text-anchor="middle">ASP.NET Core · JWT</text