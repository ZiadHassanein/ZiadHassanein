<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1100" viewBox="0 0 600 1100" fill="none" role="img" aria-labelledby="title desc"><title id="title">RepriceMax — full-stack development contributions</title><desc id="desc">RepriceMax — full-stack development contributions. Amazon SP-API integration covering listings, orders, inventory, and settlements. Co-developed a repricing engine with configurable rules and minimum/maximum limits. Developed listings and strategies end-to-end, and contributed to migration from MVC to React and TypeScript. Contributed SQL Server database design and wrote a collection-to-application stored procedure that reduced transfer time to seconds. Built reporting and exports covering listing performance, sales, margins, and CSV exports stored in Amazon S3. Coordinated technical requirements and discussions with partners. This is a map of contributions, not a system architecture or sequence.</desc><rect x=".5" y=".5" width="599" height="1099" rx="8" fill="#101720" stroke="#273341"/><g font-family="'Segoe UI', Arial, sans-serif"><g font-family="Consolas, 'Liberation Mono', monospace"><text x="28" y="33" font-size="15" fill="#91A3B8" letter-spacing="1.2">01 / SELECTED WORK</text></g><text x="26" y="82" font-size="44" fill="#E9EFF6" font-weight="650" letter-spacing="-1.3">RepriceMax</text><text x="28" y="118" font-size="24" fill="#91A3B8" >Full-stack development</text><g font-family="Consolas, 'Liberation Mono', monospace"><text x="28" y="146" font-size="13" fill="#68A9FF" letter-spacing="1.2">MY CONTRIBUTIONS</text></g><rect x="28" y="160" width="544" height="142" rx="5" stroke="#273341"/><g transform="translate(84 228) scale(1.15)" fill="none" stroke="#68A9FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-18" y="-13" width="24" height="26" rx="3"/><path d="M-10-13V-20H-2V-13M-10 13V20H-2V13M6-6H15V-14H22M6 6H15V14H22"/><circle cx="25" cy="-14" r="3"/><circle cx="25" cy="14" r="3"/></g><text x="146" y="194" 