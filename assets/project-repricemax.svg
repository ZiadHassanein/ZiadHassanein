inejoin="round"><ellipse cy="-14" rx="22" ry="8"/><path d="M-22-14V14C-22 25 22 25 22 14V-14M-22 0C-22 11 22 11 22 0"/></g><text x="213" y="512" font-size="23" fill="#E9EFF6" font-weight="600" text-anchor="middle">SQL Server</text><text x="213" y="551" font-size="18" fill="#91A3B8" text-anchor="middle">Contributed database design</text><text x="213" y="578" font-size="18" fill="#91A3B8" text-anchor="middle">Collection → app stored procedure</text><text x="213" y="605" font-size="18" fill="#91A3B8" text-anchor="middle">Transfer reduced to seconds</text><rect x="405" y="407" width="350" height="222" rx="5" stroke="#273341"/><g transform="translate(580 456) scale(1.2)" fill="none" stroke="#68A9FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-21-22H7L20-9V22H-21ZM7-22V-9H20M-13 13V4M-4 13V-2M5 13V-7"/></g><text x="580" y="512" font-size="23" fill="#E9EFF6" font-weight="600" text-anchor="middle">Reporting &amp; exports</text><text x="580" y="551" font-size="18" fill="#91A3B8" text-anchor="middle">Listing performance · sales · margins</text><text x="580" y="578" font-size="18" fill="#91A3B8" text-anchor="middle">CSV exports in Amazon S3</text><rect x="772" y="407" width="350" height="222" rx="5" stroke="#273341"/><g transform="translate(947 456) scale(1.2)" fill="none" stroke="#68A9FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-24-19H8V5H-9L-18 14V5H-24ZM15-8H24V20H15V27L6 20H-8V12"/><path d="M-16-10H0M-16-3H-4"/></g><text x="947" y="512" font-size="23" fill="#E9EFF6" font-weight="600" text-anchor="middle">Partner coordination</text><text x="947" y="551" font-size="18" fill="#91A3B8" text-anchor="middle">Technical requirements</text><text x="947" y="578" font-size="18" fill="#91A3B8" text-anchor="middle">Discussions with partners</text></g></svg>
