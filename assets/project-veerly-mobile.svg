<svg xmlns="http://www.w3.org/2000/svg" width="600" height="730" viewBox="0 0 600 730" fill="none" role="img" aria-labelledby="title desc"><title id="title">Veerly — backend, Flutter app, and learning media</title><desc id="desc">Veerly — a multilingual driving-theory app. Built the ASP.NET Core backend with JWT authentication, progress tracking, flashcards, and leaderboards. Enhanced the Flutter app and integrated lessons, practice, and progress. Created learning content and illustrations, plus driving-scene videos using Blender. Enhanced Flutter means contributions to an existing app, not sole authorship of the whole app. This is a map of contribution areas, not a system architecture or sequence.</desc><rect x=".5" y=".5" width="599" height="729" rx="8" fill="#101720" stroke="#273341"/><g font-family="'Segoe UI', Arial, sans-serif"><g font-family="Consolas, 'Liberation Mono', monospace"><text x="28" y="33" font-size="15" fill="#91A3B8" letter-spacing="1.2">02 / SELECTED WORK</text></g><text x="26" y="82" font-size="44" fill="#E9EFF6" font-weight="650" letter-spacing="-1.3">Veerly</text><text x="28" y="118" font-size="24" fill="#91A3B8" >Multilingual driving theory</text><g font-family="Consolas, 'Liberation Mono', monospace"><text x="28" y="146" font-size="13" fill="#68A9FF" letter-spacing="1.2">MY CONTRIBUTIONS</text></g><rect x="28" y="170" width="544" height="166" rx="5" stroke="#273341"/><g transform="translate(61 212) scale(0.83)" fill="none" stroke="#68A9FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-13-16-27 0-13 16M13-16 27 0 13 16M6-23-6 23"/></g><text x="104" y="220" font-size="26" fill="#E9EFF6" font-weight="600">Built backend</text><text x="50" y="268" font-size="22" fill="#91A3B8" >ASP.NET Core · JWT</text><text x="50" y="299" font-size="22" fill="#91A3B8" >Progress · flashcards · leaderboards</text><rect x="28" y="350" width="544" height="166" rx="5" stroke="#273341"/><g transform="translate(61 392) scale(0.83)" fill="